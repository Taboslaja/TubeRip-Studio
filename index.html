<!doctype html>
<html lang="hu">

  <body class="bg-neutral-950 text-neutral-100 antialiased selection:bg-red-500/30 selection:text-red-200">

                '</h2>' +
                '<p style="color: #94A3B8; font-size: 14px; line-height: 1.6; margin-bottom: 24px;">' +

                    '1. Nyisd meg a kicsomagolt mappát a Windowsban.<br>' +
                    '2. Kattints duplán az <strong>Inditas.bat</strong> fájlra (vagy a <strong>YouTube_Downloader.exe</strong>-re)!<br>' +
                    '3. A program automatikusan megnyílik a böngésződben (<strong>http://localhost:3000</strong>) a teljes modern felülettel!' +
                  '</div>' +
                '</div>' +
                '<p style="color: #64748B; font-size: 12px; margin: 0;">' +
                  'Nem szükséges semmit beállítani, az Inditas.bat mindent automatikusan elvégez.' +
                '</p>' +
